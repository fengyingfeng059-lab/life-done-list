<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人生已完成清单</title><meta name="description" content="把每一次勇敢、相遇与出发，收藏成你的生命印记。"><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap');
:root{--ink:#25332e;--muted:#79847f;--paper:#fbfaf6;--rose:#e8897e;--rose2:#f8e2dc;--sage:#dce9df;--line:#e7e5de;--gold:#f1bd70}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 3%,#f7e5d4 0,transparent 25rem),radial-gradient(circle at 8% 27%,#dceae1 0,transparent 29rem),var(--paper);color:var(--ink);font-family:'Noto Serif SC',serif;min-height:100vh}.shell{width:min(1200px,calc(100% - 32px));margin:auto;padding:42px 0 64px}.hero{text-align:center;position:relative;padding:18px 0 33px}.eyebrow{font:500 12px Outfit,sans-serif;letter-spacing:.22em;color:#b57267;text-transform:uppercase}.hero h1{font-size:clamp(33px,5vw,56px);letter-spacing:.12em;margin:10px 0 8px;font-weight:600}.hero p{margin:0;color:var(--muted);font-size:15px}.stats{display:flex;justify-content:center;gap:12px;margin-top:22px}.stat{background:#ffffffaa;border:1px solid #fff;border-radius:999px;padding:9px 17px;box-shadow:0 8px 22px #66523b0d;font:500 14px Outfit,sans-serif}.stat b{color:#d36f64;font-size:17px}.progress{width:min(500px,92%);height:9px;background:#fff;border-radius:99px;overflow:hidden;margin:21px auto 0;box-shadow:inset 0 1px 3px #715d4820}.progress i{height:100%;display:block;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:99px;transition:width .35s}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.filter{display:flex;gap:8px;flex-wrap:wrap}.filter button,.clear{border:1px solid var(--line);background:#ffffffa8;border-radius:99px;padding:8px 13px;cursor:pointer;font:500 13px 'Noto Serif SC';color:var(--muted);transition:.2s}.filter button.active{background:var(--ink);border-color:var(--ink);color:#fff}.clear:hover{color:#c75f55;border-color:#df9a91}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#ffffffb8;border:1px solid #fff;border-radius:20px;padding:20px;box-shadow:0 12px 35px #39352a0a;backdrop-filter:blur(9px);min-width:0}.card:nth-child(2) .marker{background:#e7f0eb}.card:nth-child(3) .marker{background:#f9e9d3}.card h2{font-size:18px;margin:0 0 15px;display:flex;align-items:center;gap:9px}.marker{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--rose2);font:500 12px Outfit,sans-serif;color:#a95e54}.list{display:flex;flex-wrap:wrap;gap:8px}.item{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;color:#4c5852;font-size:14px;cursor:pointer;user-select:none;transition:transform .16s,background .2s,border-color .2s,color .2s;line-height:1.35}.item:hover{transform:translateY(-2px);border-color:#d7aba3}.item.done{background:var(--ink);border-color:var(--ink);color:#fff;text-decoration:line-through;text-decoration-color:#f5c0b8;text-decoration-thickness:1.5px}.item.done:before{content:'✓';font-family:Outfit,sans-serif;margin-right:5px;color:#ffd1ca}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:45px}.foot{text-align:center;color:#89918c;font-size:12px;margin:30px 0 0}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.shell{padding-top:24px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.hero h1{font-size:34px}.card{padding:17px}}
</style></head><body><main class="shell"><header class="hero"><div class="eyebrow">a collection of becoming</div><h1>人生已完成清单</h1><p>把每一次勇敢、相遇与出发，收藏成你的生命印记。</p><div class="stats"><span class="stat">已完成 <b id="count">0</b> / <span id="total">0</span></span><span class="stat">完成度 <b id="percent">0%</b></span></div><div class="progress"><i id="bar"></i></div></header><section class="toolbar"><div class="filter"><button class="active" data-filter="all">全部</button><button data-filter="todo">待完成</button><button data-filter="done">已完成</button></div><button class="clear" id="clear">清空勾选</button></section><section class="grid" id="grid"></section><p class="foot">进度仅保存在这台设备的浏览器中 · 慢慢成为你想成为的人</p></main><script>
const groups=[
['心动与关系','送礼物|被送礼物|暗恋|明恋|失恋|表白|被表白|留长发|剪短发|染发|漂发|烫发|化妆|做美甲|放下一个人|有过遗憾|爱而不得|双向奔赴|当海王|拒绝他人表白|表白被拒|被渣|犯过傻|装糊涂|吵架|绝交|晚上一个人哭|献血|向陌生人吐露心声|谈过一场刻骨铭心的恋爱'],
['独处与自我','一个人逛超市|一个人去图书馆|一个人看病|一个人去唱歌|社死过|一个人出门逛|一个人在外难过|给自己写信|一个人旅行|拥有要好的异性朋友|谈恋爱|被老师点名表扬|被老师点名批评|被背叛|被伤害|被坚定选择|获奖|有过超过5年的兴趣爱好|自己一个人住宾馆|一个人散步|夜跑|深夜散心|一个人出去吃饭|一个人看电影|一个人去酒吧|一个人过生日'],
['成长与校园','考试不及格|考试第一名|当班干部|竞选学生会|上电视|上报纸|登台演出|主持节目|演讲|野性消费|被雪糕刺客伤过|全校表扬|学一种外语|写论文|写书|写诗|写日记|写剧本|写歌|拍影片|参加比赛|拍写真|买相机|会一种乐器|参加志愿活动|在图书馆待一天|通宵补作业|犯校规|迟到|旷课|上课睡觉|打架被叫家长'],
['出发与冒险','出国|登山|看雪|看海|看日出|看日落|自驾游|独自坐飞机|拼拼图|游泳|滑雪|滑冰|早冰|滑板|去野炊|攀岩|蹦极|骑马|卡丁车|坐过山车|泡温泉|淋雨|种花|养宠物|看极光|去游乐场|去看现场演唱会|去音乐节|去签售会|去密室|去鬼屋|看鬼片'],
['生活与担当','兼职|打工|捐款|道歉|释怀|失望|给父母买衣服|当伴娘(郎)|娶/嫁也雄|和同学打水仗|社团活动|组建社团|写信|办生日会|健身|买名牌|开网店|练字|沉迷游戏|拍毕业照|面试成功|放孔明灯|逛小吃街|和网友见面|发表成果|买唱片|异地恋|异国恋|认识不同国籍的人|进公司工作|做未来规划|搬家|一个人租房|转学|被骗|撒谎|改掉一个坏习惯|加入校队|坐摩天轮|在朋友家过夜|擅长一项运动'],
['家的味道','住院|做手术|晕倒|会做饭|做一桌菜|做饭给家人|做甜品给喜欢的人|有超过10年的好朋友|有个无条件可信任的朋友|买花|被送花|给自己买礼物']
];
const grid=document.querySelector('#grid'),saved=new Set(JSON.parse(localStorage.getItem('life-list-v1')||'[]'));let filter='all';const all=groups.flatMap(([,s])=>s.split('|'));function key(x){return x}function persist(){localStorage.setItem('life-list-v1',JSON.stringify([...saved]))}function render(){grid.innerHTML='';let shown=0;groups.forEach(([name,raw],gi)=>{let items=raw.split('|').filter(x=>filter==='all'||filter==='done'?filter==='all'||saved.has(key(x)):!saved.has(key(x)));if(!items.length)return;shown+=items.length;let c=document.createElement('article');c.className='card';c.innerHTML='<h2><span class="marker">0'+(gi+1)+'</span>'+name+'</h2><div class="list"></div>';let l=c.querySelector('.list');items.forEach(x=>{let b=document.createElement('button');b.className='item'+(saved.has(key(x))?' done':'');b.textContent=x;b.onclick=()=>{saved.has(key(x))?saved.delete(key(x)):saved.add(key(x));persist();render()};l.append(b)});grid.append(c)});if(!shown)grid.innerHTML='<div class="empty">这里暂时没有项目。</div>';let n=saved.size,t=all.length,p=Math.round(n/t*100);count.textContent=n;total.textContent=t;percent.textContent=p+'%';bar.style.width=p+'%'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelector('.active').classList.remove('active');b.classList.add('active');render()});clear.onclick=()=>{if(confirm('确定清空所有已完成标记吗？')){saved.clear();persist();render()}};render();
</script></body></html>
